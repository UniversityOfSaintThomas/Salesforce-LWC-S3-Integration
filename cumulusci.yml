minimum_cumulusci_version: '3.93.0'
project:
  name: Salesforce-LWC-S3-Integration
  package:
    name: Salesforce-LWC-S3-Integration
    api_version: '67.0'
  git:
    default_branch: 'main'
  source_format: sfdx

tasks:
  robot:
    options:
      suites: robot/Salesforce-LWC-S3-Integration/tests
      options:
        outputdir: robot/Salesforce-LWC-S3-Integration/results

  robot_testdoc:
    options:
      path: robot/Salesforce-LWC-S3-Integration/tests
      output: robot/Salesforce-LWC-S3-Integration/doc/Salesforce-LWC-S3-Integration_tests.html

  run_tests:
    options:
      required_org_code_coverage_percent: 75

  deploy_dev_config:
    description: Deploy Contact demo/example config (fields, layouts, flexipages, flow) used to showcase the packaged AWS S3 Directory Image feature on a Contact record. Not part of the packaged feature itself.
    class_path: cumulusci.tasks.salesforce.Deploy
    options:
      path: unpackaged/config/dev-demo

  deploy_permission_set:
    description: Give System Admins the AWS S3 Directory Image permission set and the dev-only Contact field permission set
    class_path: cumulusci.tasks.apex.anon.AnonymousApexTask
    options:
      namespace_inject: $project_config.project__package__namespace
      apex: >
        List<PermissionSet> permSets = [SELECT Name, Id FROM PermissionSet WHERE Name IN ('AWS_S3_Directory_Image', 'AWS_S3_Directory_Image_Developer_Fields')];

        List<PermissionSetAssignment> permissionSetList = new List<PermissionSetAssignment>();
        if (!permSets.isEmpty()) {
            for (User u: [ SELECT ID FROM User WHERE Profile.Name = 'System Administrator' ]) {
                for (PermissionSet ps : permSets) {
                    permissionSetList.add(new PermissionSetAssignment(PermissionSetId = ps.Id, AssigneeId = u.Id));
                }
            }
        }
        if (!permissionSetList.isEmpty()) {
            upsert permissionSetList;
        }
flows:
  config_dev:
    steps:
      3:
        task: deploy_dev_config
      4:
        task: deploy_permission_set