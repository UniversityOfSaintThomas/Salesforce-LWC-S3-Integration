<!-- Amazon S3 Directory Image -->
<template>
    <lightning-input
            type="file"
            label="Upload a directory image"
            name="directoryImageUploader"
            accept={acceptedFormats}
            onchange={handleUploadFile}
            multiple=false
            disabled={isUploading}
            class="slds-m-top_medium"
    >
    </lightning-input>
</template>
