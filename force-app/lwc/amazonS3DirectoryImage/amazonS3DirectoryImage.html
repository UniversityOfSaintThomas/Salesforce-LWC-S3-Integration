<!-- Amazon S3 Directory Image -->
<template>
    <div class="slds-p-around_medium slds-box_border slds-box_small">
        <div class="slds-is-relative slds-p-around_small">
            <template if:true={showSpinner}>
                <lightning-spinner alternative-text="Uploading..." size="medium"></lightning-spinner>
            </template>
            <template if:true={error}>
                <c-error-panel errors={error}></c-error-panel>
            </template>

            <template if:true={currentImageULR}>
                <img src={currentImageULR} alt="Directory Image" style="max-width: 100%;"/>
            </template>

            <lightning-input
                    type="file"
                    label="Upload an image (jpg, jpeg, gif, png)"
                    name="directoryImageUploader"
                    accept={acceptedFormats}
                    onchange={handleUploadFile}
                    multiple=false
                    disabled={showSpinner}
            >
            </lightning-input>
        </div>
    </div>
</template>
