<!-- Amazon S3 Directory Image -->
<template>
    <template if:true={currentImageULR}>
        <div class="slds-m-around_medium">
            <img src={currentImageULR} alt="Directory Image" style="width: 100%; height: auto;"/>
        </div>
    </template>
    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Uploading..." size="medium"></lightning-spinner>
    </template>

    <lightning-input
            type="file"
            label="Upload a directory image"
            name="directoryImageUploader"
            accept={acceptedFormats}
            onchange={handleUploadFile}
            multiple=false
            disabled={isUploading}
            class="slds-m-top_medium"
    >
    </lightning-input>
</template>
